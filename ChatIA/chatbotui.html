<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - ExcelencIA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="chat.css">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/tema escuro/excelencia texto ia.PNG">

    <style>
        /* Timer minimal styling (não depende do chat.css) */
        .chat-header {
            align-items: center;
            gap: 12px;
        }

        .chat-timer {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .chat-timer.warn {
            color: #ffb020;
        }

        .chat-timer.danger {
            color: #ff5b5b;
        }

        /* Botão Terminar Simulação */
        .end-interview-btn {
            background: linear-gradient(135deg, #d63031, #e74c3c);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .end-interview-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .end-interview-btn i {
            font-size: 0.9rem;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .chat-header {
                flex-wrap: wrap;
            }

            .end-interview-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            .end-interview-btn span {
                display: none;
            }

            .chat-timer {
                padding: 5px 8px;
                font-size: 0.85rem;
            }
        }

        /* ===== SCORE MODAL ===== */
        /* ...existing code... */
    </style>
</head>

<body>
    <div class="chat-container">
        <!-- OVERLAY -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img class="logo-excelencia" src="../assets/tema escuro/logo-excelencia.PNG" alt="ExcelencIA">
                <button class="sidebar-close-btn" id="sidebarCloseBtn" title="Fechar menu">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <button class="back-home-btn" id="backHomeBtn" title="Voltar para página inicial">
                <i class="fas fa-arrow-left"></i>
                Voltar
            </button>

            <button class="new-chat-btn" id="newChatBtn">
                <i class="fas fa-plus"></i>
                Nova Simulação
            </button>

            <div class="chat-history" id="chatHistory">
                <div class="chat-item active" data-chat-id="1">Simulação de entrevista</div>

            </div>
        </div>

        <!-- MODAL DE SETUP (Aparece primeiro) -->
        <div class="setup-overlay" id="setupOverlay">
            <div class="setup-modal" id="setupModal">
                <div class="setup-content">
                    <div class="setup-header">
                        <h1>SIMULAÇÃO DE ENTREVISTA</h1>
                    </div>
                    <p class="setup-subtitle">Tipo de entrevista:</p>

                    <div class="setup-form">
                        <!-- Área Profissional -->
                        <div class="form-group">
                            <label for="professionalArea">Área profissional:</label>
                            <select id="professionalArea" class="form-select">
                                <option value="">Selecione uma área</option>
                                <option value="desenvolvimento">Desenvolvedor de Software</option>
                                <option value="marketing">Supervisor de Marketing</option>
                                <option value="vendas">Gerente de Vendas</option>
                                <option value="rh">Analista de RH</option>
                                <option value="design">Designer UX/UI</option>
                                <option value="dados">Analista de Dados</option>
                                <option value="produto">Product Manager</option>
                                <option value="financeiro">Analista Financeiro</option>
                            </select>
                        </div>

                        <!-- Nível de Dificuldade -->
                        <div class="form-group">
                            <label for="difficulty">Nível de dificuldade:</label>
                            <select id="difficulty" class="form-select">
                                <option value="facil">Fácil</option>
                                <option value="medio">Médio</option>
                                <option value="dificil">Difícil</option>
                                <option value="expert">Expert</option>
                            </select>
                        </div>

                        <!-- Tempo Estimado -->
                        <div class="form-group">
                            <label for="duration">Tempo estimado:</label>
                            <select id="duration" class="form-select">
                                <!-- corrigido: 1 min agora é value="1" -->
                                <option value="1">1 min</option>
                                <option value="15">15 min</option>
                                <option value="30" selected>30 min</option>
                                <option value="45">45 min</option>
                            </select>
                        </div>

                        <!-- Tipo de Avaliação -->
                        <div class="form-group">
                            <label for="evaluationType">Tipo de Avaliação:</label>
                            <select id="evaluationType" class="form-select">
                                <option value="tecnica">Técnica</option>
                                <option value="comportamental">Comportamental</option>
                                <option value="mista">Mista</option>
                            </select>
                        </div>

                        <!-- Botão Iniciar -->
                        <button type="button" class="btn-start" id="startInterviewBtn">
                            <i class="fas fa-play"></i>
                            Iniciar Simulação
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MAIN CHAT (Escondido inicialmente) -->
        <div class="chat-main" id="chatMain" style="display: none;">
            <!-- HEADER -->
            <div class="chat-header">
                <button class="menu-toggle" id="menuToggle" title="Abrir menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="chat-title" id="chatTitle">Simulação de Entrevista</div>
                <!-- Timer visível -->
                <div class="chat-timer" id="chatTimer" aria-live="polite" title="Tempo restante">
                    ⏱️ <span id="timerDisplay">--:--</span>
                </div>
                <!-- Botão Terminar Simulação -->
                <button class="end-interview-btn" id="endInterviewBtn" title="Terminar simulação agora">
                    <i class="fas fa-stop-circle"></i>
                    <span>Terminar</span>
                </button>
            </div>

            <!-- MESSAGES -->
            <div class="messages-area" id="messagesArea">
                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="empty-text">Comece uma conversa</div>
                    <div class="empty-subtext">Digite sua primeira mensagem para iniciar</div>
                </div>
            </div>

            <!-- INPUT -->
            <div class="input-area">
                <form class="input-form" id="chatForm">
                    <div class="input-wrapper">
                        <input type="text" class="chat-input" id="messageInput"
                            placeholder="Escreva sua resposta aqui..." autocomplete="off">
                        <div class="input-actions">
                            <button type="button" class="action-btn" id="attachBtn" title="Anexar arquivo">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <button type="button" class="action-btn" id="microphoneBtn" title="Microfone">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- ===== SCORE MODAL (aparece ao terminar o tempo) ===== -->
        <div class="score-overlay" id="scoreOverlay" aria-hidden="true">
            <div class="score-modal" role="dialog" aria-modal="true" aria-labelledby="scoreTitle">
                <button class="score-close-btn" id="scoreCloseBtn" aria-label="Fechar">&times;</button>
                <div class="score-header">
                    <h2 id="scoreTitle">Seu Desempenho</h2>
                    <p class="score-subtitle">Resumo da sua simulação</p>
                </div>
                <div class="score-body">
                    <div class="score-circle" id="scoreCircle" style="--p:0%">
                        <span id="scorePercent">0%</span>
                    </div>
                    <p class="score-note">Continue praticando para melhorar ainda mais.</p>
                </div>
                <div class="score-actions">
                    <button class="btn-report" id="viewReportBtn">Ver relatório geral</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =============================================== */
        /* ========== MODAL DE SETUP - INÍCIO ========== */
        /* =============================================== */
        
        // Elementos do modal de setup
        const setupOverlay = document.getElementById('setupOverlay');
        const setupModal = document.getElementById('setupModal');
        const chatMain = document.getElementById('chatMain');
        const startInterviewBtn = document.getElementById('startInterviewBtn');
        const professionalAreaSelect = document.getElementById('professionalArea');
        const difficultySelect = document.getElementById('difficulty');
        const durationSelect = document.getElementById('duration');
        const evaluationTypeSelect = document.getElementById('evaluationType');
        const chatTitleElement = document.getElementById('chatTitle');

        // Timer refs
        const timerDisplay = document.getElementById('timerDisplay');
        const chatTimerEl = document.getElementById('chatTimer');
        const endInterviewBtn = document.getElementById('endInterviewBtn');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        let timerInterval = null;
        let timeLeftSec = 0;

        function formatTime(totalSec) {
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateTimerUI() {
            timerDisplay.textContent = formatTime(timeLeftSec);
            chatTimerEl.classList.remove('warn', 'danger');
            if (timeLeftSec <= 60) {
                chatTimerEl.classList.add('danger');
            } else if (timeLeftSec <= 5 * 60) {
                chatTimerEl.classList.add('warn');
            }
        }

        function endInterviewDueToTime() {
            addMessage('Tempo encerrado! A entrevista terminou. Obrigado por participar.', false);
            messageInput.disabled = true;
            sendBtn.disabled = true;
            endInterviewBtn.disabled = true;

            // calcula e exibe score
            const percent = calculatePerformance();
            showScoreModal(percent);
        }

        function endInterviewManually() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            addMessage('Você encerrou a simulação. Obrigado por participar!', false);
            messageInput.disabled = true;
            sendBtn.disabled = true;
            endInterviewBtn.disabled = true;

            // calcula e exibe score
            const percent = calculatePerformance();
            showScoreModal(percent);
        }

        function startTimer(minutes) {
            // limpar timers anteriores
            if (timerInterval) clearInterval(timerInterval);
            timeLeftSec = Math.max(0, parseInt(minutes, 10) || 0) * 60;
            updateTimerUI();
            if (timeLeftSec === 0) {
                endInterviewDueToTime();
                return;
            }
            timerInterval = setInterval(() => {
                timeLeftSec -= 1;
                updateTimerUI();
                if (timeLeftSec <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    endInterviewDueToTime();
                }
            }, 1000);
        }

        // Função para iniciar a entrevista
        startInterviewBtn.addEventListener('click', () => {
            // Validar se uma área foi selecionada
            if (!professionalAreaSelect.value) {
                alert('Por favor, selecione uma área profissional antes de continuar.');
                return;
            }
            
            // Coletar dados da simulação
            const simulationData = {
                area: professionalAreaSelect.options[professionalAreaSelect.selectedIndex].text,
                difficulty: difficultySelect.options[difficultySelect.selectedIndex].text,
                duration: durationSelect.value,
                evaluationType: evaluationTypeSelect.options[evaluationTypeSelect.selectedIndex].text
            };
            
            // Atualizar título do chat
            chatTitleElement.textContent = `Simulação de Entrevista - ${simulationData.area}`;
            
            // Esconder modal e mostrar chat
            setupOverlay.style.display = 'none';
            chatMain.style.display = 'flex';

            // iniciar temporizador com o tempo escolhido
            startTimer(Number(simulationData.duration));
            
            // Adicionar mensagem inicial da IA
            setTimeout(() => {
                addMessage(
                    `Olá! Bem-vindo à simulação de entrevista para ${simulationData.area}. ` +
                    `Esta é uma entrevista ${simulationData.evaluationType} de nível ${simulationData.difficulty}. ` +
                    `Vamos começar! Conte-me um pouco sobre você e sua experiência.`,
                    false
                );
            }, 500);
            
            console.log('Iniciando simulação com:', simulationData);
        });
        
        // Botão terminar simulação
        endInterviewBtn.addEventListener('click', () => {
            const confirmEnd = confirm('Deseja realmente encerrar a simulação agora?');
            if (confirmEnd) {
                endInterviewManually();
            }
        });
        
        /* =============================================== */
        /* ========== MODAL DE SETUP - FIM ============= */
        /* =============================================== */

        // Menu toggle functionality
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
        const messagesArea = document.getElementById('messagesArea');
        const chatForm = document.getElementById('chatForm');
        const backHomeBtn = document.getElementById('backHomeBtn');

        const closeSidebar = () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        };

        // Back to home button
        backHomeBtn.addEventListener('click', () => {
            window.location.href = '../html/homeLogin.html';
        });

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        });

        // Close sidebar when clicking on overlay
        sidebarOverlay.addEventListener('click', closeSidebar);

        // Close sidebar when clicking close button
        sidebarCloseBtn.addEventListener('click', closeSidebar);

        // Close sidebar when clicking on a chat item
        document.querySelectorAll('.chat-item').forEach(item => {
            item.addEventListener('click', closeSidebar);
        });

        // Function to add message to chat
        function addMessage(text, isUser, score = null, feedback = null) {
            // Remove empty state on first message
            if (messagesArea.querySelector('.empty-state')) {
                messagesArea.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            let contentHTML = `
                <div class="message-content">
                    ${text}
                    ${score ? `<div class="message-score">Score: ${score} - ${feedback}</div>` : ''}
                </div>
                <div class="message-icon">
                    <i class="fas fa-${isUser ? 'user' : 'robot'}"></i>
                </div>
            `;

            if (isUser) {
                contentHTML = `
                    <div class="message-content">
                        ${text}
                    </div>
                    <div class="message-icon">
                        <i class="fas fa-user"></i>
                    </div>
                `;
            }

            messageDiv.innerHTML = contentHTML;
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Handle form submission
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();

            if (text) {
                addMessage(text, true);
                messageInput.value = '';

                // Simulate bot response
                setTimeout(() => {
                    addMessage('Ótima resposta! Você demonstrou um bom conhecimento. Agora vamos para a próxima pergunta...');
                }, 500);
            }
        });

        // Refs da UI do score
        const scoreOverlay = document.getElementById('scoreOverlay');
        const scoreCloseBtn = document.getElementById('scoreCloseBtn');
        const scorePercentEl = document.getElementById('scorePercent');
        const scoreCircleEl = document.getElementById('scoreCircle');
        const viewReportBtn = document.getElementById('viewReportBtn');

        function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
        }

        // Calcula uma % simples baseada em quantidade e tamanho médio das respostas do usuário
        function calculatePerformance() {
            const userMsgs = [...document.querySelectorAll('#messagesArea .message.user .message-content')];
            if (userMsgs.length === 0) return 50; // base se não respondeu
            const lengths = userMsgs.map(el => (el.textContent || '').trim().length);
            const avgLen = lengths.reduce((a, b) => a + b, 0) / lengths.length;

            // fórmula simples: base 55 + impacto por qtd de mensagens + impacto por tamanho médio
            let score = 55 + (userMsgs.length * 6) + (avgLen / 12);
            score = clamp(Math.round(score), 0, 100);
            // se muito curto, empurra para faixa média
            if (score < 45 && userMsgs.length > 0) score = 45 + Math.min(10, userMsgs.length * 3);
            return score;
        }

        function showScoreModal(percent) {
            const p = clamp(percent, 0, 100);
            scorePercentEl.textContent = p + '%';
            scoreCircleEl.style.setProperty('--p', p + '%');
            scoreOverlay.classList.add('active');
            scoreOverlay.setAttribute('aria-hidden', 'false');
        }

        function hideScoreModal() {
            scoreOverlay.classList.remove('active');
            scoreOverlay.setAttribute('aria-hidden', 'true');
        }

        scoreCloseBtn.addEventListener('click', hideScoreModal);
        scoreOverlay.addEventListener('click', (e) => {
            if (e.target === scoreOverlay) hideScoreModal();
        });
        viewReportBtn.addEventListener('click', () => {
            window.location.href = '../html/relatorios.html';
        });

        // Opcional: limpar o timer ao sair da página
        window.addEventListener('beforeunload', () => {
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
    <script src="script-chat.js"></script>
</body>

</html>
